services:
  postgres:
    image: postgres:16-alpine
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: persian_analytics
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sma_network

  redis:
    image: redis:7-alpine
    container_name: sma_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ../data/redis:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sma_network

  backend:
    build: .
    image: sma_backend:latest
    container_name: sma_backend
    restart: unless-stopped
    environment:
      - APP_NAME=Persian Social Analytics
      - DEBUG=True
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/persian_analytics
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/persian_analytics
      - REDIS_URL=redis://redis:6379/0
      - BRAIN_SERVICE_URL=http://sma_brain:8001
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=Admin123!
      - AUTO_INIT_DB=True
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - sma_network

  celery:
    build: .
    image: sma_celery:latest
    container_name: sma_celery
    restart: unless-stopped
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/persian_analytics
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/persian_analytics
      - REDIS_URL=redis://redis:6379/0
      - BRAIN_SERVICE_URL=http://sma_brain:8001
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=your-super-secret-key-change-this-in-production
    depends_on:
      - backend
    networks:
      - sma_network

networks:
  sma_network:
    name: sma_network
    driver: bridge
