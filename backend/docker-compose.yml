
services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: persian_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: persian_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================
  # Redis Cache & Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: persian_analytics_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: persian_analytics_backend
    restart: unless-stopped
    environment:
      # Application
      - APP_NAME=Persian Social Analytics
      - APP_VERSION=1.0.0
      - DEBUG=True
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - API_V1_PREFIX=/api/v1
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/persian_analytics
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/persian_analytics
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # BRAIN Service
      - BRAIN_SERVICE_URL=http://persian_analytics_brain:8001
      - BRAIN_SERVICE_TIMEOUT=300
      # JWT
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALGORITHM=HS256
      # CORS
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8080","http://localhost:5173"]
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Default Admin (auto-created on startup)
      - DEFAULT_ADMIN_EMAIL=admin@example.com
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=Admin123!
      - AUTO_INIT_DB=True
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - app_network

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: persian_analytics_celery
    restart: unless-stopped
    command: celery -A app.services.celery_app worker --loglevel=info
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/persian_analytics
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/persian_analytics
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # BRAIN Service
      - BRAIN_SERVICE_URL=http://persian_analytics_brain:8001
      - BRAIN_SERVICE_TIMEOUT=300
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # JWT (needed for imports)
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      - backend
      - redis
    healthcheck:
      test: ["CMD", "celery", "-A", "app.services.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - app_network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  app_network:
    driver: bridge
