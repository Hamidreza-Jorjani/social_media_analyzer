services:
  brain:
    build: .
    image: sma_brain:latest
    container_name: sma_brain
    restart: unless-stopped
    ports:
      - "18001:8001"
    environment:
      - DEBUG=true
      - SIMULATE_GPU=true
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - sma_network

networks:
  sma_network:
    external: true
